openapi: 3.1.0
info:
  title: Jeeves API
  version: 1.0.0
  description: Authenticated action-based API for Jeeves services and user-owned data.
servers:
  - url: https://aelsipdtezvhjkwsshqx.supabase.co/functions/v1/jeeves-api
security:
  - bearerAuth: []
    publishableKey: []
paths:
  /:
    post:
      summary: Execute a Jeeves API action
      description: All operations use one authenticated action envelope. Data actions are scoped to the signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequest'
            examples:
              listTasks:
                value:
                  action: tasks.list
                  payload:
                    limit: 25
              createTask:
                value:
                  action: tasks.create
                  payload:
                    title: Book dentist
                    confirmed: true
              chat:
                value:
                  action: ai.chat
                  payload:
                    message: Help me plan my week.
                    mode: 3
      responses:
        "200":
          description: Action result
        "201":
          description: Resource created
        "400":
          description: Invalid request or missing explicit confirmation
        "401":
          description: Authentication required
        "403":
          description: Permission denied
        "404":
          description: Unknown action or resource
        "429":
          description: Rate limit reached
        "501":
          description: Feature intentionally disabled (server-side voice)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    publishableKey:
      type: apiKey
      in: header
      name: apikey
  schemas:
    ApiRequest:
      type: object
      additionalProperties: false
      required: [action, payload]
      properties:
        action:
          type: string
          enum:
            - system.status
            - ai.chat
            - health.sync
            - health.notify
            - health.records.list
            - tasks.list
            - tasks.create
            - tasks.update
            - tasks.delete
            - memories.list
            - memories.create
            - memories.delete
            - conversations.list
            - conversations.create
            - conversations.messages.list
            - conversations.messages.create
            - google.action
            - voice.generate
        payload:
          type: object
          description: Action-specific JSON fields. Task and memory creation require confirmed=true. Server-side voice is disabled.
