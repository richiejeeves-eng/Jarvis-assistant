openapi: 3.1.0
info:
  title: Jeeves API
  version: 1.0.0
  description: Authenticated, user-scoped API facade for Jeeves.
servers:
  - url: https://aelsipdtezvhjkwsshqx.supabase.co/functions/v1/jeeves-api
security:
  - bearerAuth: []
    publishableKey: []
paths:
  /v1:
    get:
      summary: Get API catalogue
      responses:
        "200":
          description: API capabilities
  /v1/brain:
    post:
      summary: Send a message to Jeeves Brain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  maxLength: 2000
                mode:
                  type: integer
                timezone:
                  type: string
                active_advisers:
                  type: array
                  items:
                    type: string
                    enum: [mind, body, soul]
      responses:
        "200":
          description: Jeeves response
        "401":
          description: Authentication required
        "429":
          description: Rate limit reached
  /v1/google:
    post:
      summary: Call an authorised Google integration action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [authorize, status, disconnect, events, create, gmailMessages, gmailReply, driveFiles, syncTasks, createTask, deleteTask, completeTask]
      responses:
        "200":
          description: Google integration result
        "401":
          description: Authentication required
  /v1/health/sync:
    post:
      summary: Store Health Connect records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  maxItems: 500
                  items:
                    type: object
      responses:
        "200":
          description: Sync result
  /v1/health/notify:
    post:
      summary: Send a notification for an authorised health sync request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Notification result
  /v1/voice:
    post:
      summary: Voice generation (disabled)
      responses:
        "501":
          description: Disabled until a verified no-cost provider is configured
  /v1/data/{table}:
    parameters:
      - name: table
        in: path
        required: true
        schema:
          type: string
          enum: [tasks, memories, conversations, conversation_messages, health_records]
    get:
      summary: Read user-owned records
      parameters:
        - name: select
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Rows permitted by Row Level Security
    post:
      summary: Insert user-owned records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                - type: array
                  items:
                    type: object
      responses:
        "201":
          description: Insert result
    patch:
      summary: Update user-owned records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Update result
    delete:
      summary: Delete user-owned records
      responses:
        "200":
          description: Delete result
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    publishableKey:
      type: apiKey
      in: header
      name: apikey
