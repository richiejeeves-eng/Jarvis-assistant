name: Validate Jeeves web and Edge Functions

on:
  push:
    paths:
      - "*.js"
      - "supabase/functions/**"
      - ".github/workflows/web-check.yml"
  pull_request:
    paths:
      - "*.js"
      - "supabase/functions/**"
      - ".github/workflows/web-check.yml"

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done

  validate-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          for file in supabase/functions/*/index.ts; do
            echo "Checking $file"
            deno check "$file"
          done
