<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#080d18;color:#eaf2ff;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{padding:14px 20px;border-bottom:1px solid #263750}
h1{letter-spacing:5px;color:#65baff;margin:0;font-size:22px}
small{color:#8296b0}
#account{background:#111d30;border:1px solid #263b57;border-radius:12px;padding:10px 14px;margin:8px 12px}
#account summary{color:#65e6ad;cursor:pointer}
button{background:#237cbd;color:white;border:0;padding:12px 14px;border-radius:9px;margin:4px 4px 4px 0}
input{width:100%;padding:13px;background:#081323;border:1px solid #34506d;color:white;border-radius:9px;margin:6px 0}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.4;word-wrap:break-word}
.user{align-self:flex-end;background:#237cbd;color:white}
.bot{align-self:flex-start;background:#111d30;border:1px solid #263b57;color:#9fcfff}
.note{align-self:flex-start;color:#65e6ad;font-size:13px}
.taskrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.taskrow button{padding:6px 12px;margin:0}
.done{text-decoration:line-through;opacity:0.5}
#tools{padding:0 12px}
#bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #263750}
#bar input{flex:1;margin:0}
#bar button{margin:0}
</style>
</head>
<body>
<header>
<h1>JARVIS</h1>
<small>VERSION 0.6 · AI, memory and tasks connected</small>
</header>

<details id="account" open>
<summary id="authstatus">Checking...</summary>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password (6+ characters)">
<button onclick="signUp()">Sign up</button>
<button onclick="signIn()">Sign in</button>
<button onclick="signOut()">Sign out</button>
</details>

<div id="chat"></div>

<div id="tools">
<button onclick="showMemories()">Show memories</button>
<button onclick="showTasks()">Show tasks</button>
<button onclick="clearChat()">Clear chat</button>
</div>

<div id="bar">
<input id="command" placeholder="Message JARVIS...">
<button id="sendbtn" onclick="send()">Send</button>
</div>

<script>
const SUPABASE_URL = "https://aelsipdtezvhjkwsshqx.supabase.co";
const SUPABASE_KEY = "sb_publishable_JbN0kUdtX6d5J8bWAPbz4w_syw2aG4K";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let history = [];

function showStatus(text) {
  document.getElementById("authstatus").textContent = text;
}

function scrollChat() {
  const chat = document.getElementById("chat");
  chat.scrollTop = chat.scrollHeight;
}

function addMessage(text, who) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  scrollChat();
  return div;
}

function addNote(text) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "note";
  div.textContent = text;
  chat.appendChild(div);
  scrollChat();
}

function clearChat() {
  document.getElementById("chat").textContent = "";
  history = [];
  addMessage("Chat cleared. How can I help?", "bot");
}

async function signUp() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || password.length < 6) {
    showStatus("Enter an email and a password of at least 6 characters.");
    return;
  }

  const { error } = await db.auth.signUp({
    email: email,
    password: password,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });

  if (error) {
    showStatus("Sign up error: " + error.message);
    return;
  }

  showStatus("Check your email and tap the confirmation link, then come back here and tap Sign in.");
}

async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    showStatus("Sign in error: " + error.message);
    return;
  }

  document.getElementById("password").value = "";
}

async function signOut() {
  await db.auth.signOut();
}

db.auth.onAuthStateChange((event, session) => {
  const account = document.getElementById("account");
  if (session) {
    showStatus("● Signed in as " + session.user.email);
    account.open = false;
  } else {
    showStatus("Not signed in. Tap to sign in.");
    account.open = true;
  }
});

async function requireSession() {
  const { data } = await db.auth.getSession();
  if (!data.session) {
    addMessage("Please sign in first (tap the Account bar at the top).", "bot");
    return false;
  }
  return true;
}

async function send() {
  const input = document.getElementById("command");
  const button = document.getElementById("sendbtn");
  const message = input.value.trim();

  if (!message) return;

  if (!(await requireSession())) return;

  addMessage(message, "user");
  input.value = "";
  button.disabled = true;

  const thinking = addMessage("JARVIS is thinking...", "bot");

  const { data, error } = await db.functions.invoke("jarvis-brain", {
    body: {
      message: message,
      history: history.slice(-10),
      now: new Date().toString(),
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    }
  });

  button.disabled = false;

  if (error) {
    let detail = error.message;
    try {
      const body = await error.context.json();
      if (body && body.error) detail = body.error;
    } catch (e) {}
    thinking.textContent = "AI error: " + detail;
    return;
  }

  thinking.textContent = data.reply;

  history.push({ role: "user", text: message });
  history.push({ role: "model", text: data.reply });
  history = history.slice(-10);

  if (data.saved) {
    addNote("💾 Saved to memory: " + data.saved);
  }

  if (data.task) {
    addNote("✅ Task added: " + data.task + " (tap Show tasks to see it)");
  }

  scrollChat();
}

async function showMemories() {
  if (!(await requireSession())) return;

  const { data, error } = await db
    .from("memories")
    .select("content, category, created_at")
    .order("created_at", { ascending: false })
    .limit(10);

  if (error) {
    addMessage("Memory error: " + error.message, "bot");
    return;
  }

  if (data.length === 0) {
    addMessage("JARVIS memory is empty.", "bot");
    return;
  }

  addMessage("JARVIS REMEMBERS:\n\n" + data
    .map(item => "• " + item.content)
    .join("\n"), "bot");
}

async function showTasks() {
  if (!(await requireSession())) return;

  const { data, error } = await db
    .from("tasks")
    .select("id, title, due_at")
    .eq("status", "pending")
    .order("due_at", { ascending: true, nullsFirst: false })
    .limit(20);

  if (error) {
    addMessage("Task error: " + error.message, "bot");
    return;
  }

  if (data.length === 0) {
    addMessage("No pending tasks.", "bot");
    return;
  }

  const box = addMessage("YOUR TASKS", "bot");

  data.forEach(function (task) {
    const row = document.createElement("div");
    row.className = "taskrow";

    const label = document.createElement("span");
    let text = "• " + task.title;
    if (task.due_at) {
      text += "\n   due " + new Date(task.due_at).toLocaleString();
    }
    label.textContent = text;

    const doneButton = document.createElement("button");
    doneButton.textContent = "Done";
    doneButton.onclick = async function () {
      const { error: updateError } = await db
        .from("tasks")
        .update({ status: "done" })
        .eq("id", task.id);

      if (updateError) {
        addMessage("Task error: " + updateError.message, "bot");
        return;
      }

      label.className = "done";
      doneButton.remove();
    };

    row.appendChild(label);
    row.appendChild(doneButton);
    box.appendChild(row);
  });

  scrollChat();
}

document.getElementById("command").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    send();
  }
});

addMessage("JARVIS online. How can I help?", "bot");
</script>
</body>
</html>
