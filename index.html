<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeeves</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css?v=1.6.0">
<meta name="theme-color" content="#080d18">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
<h1>JEEVES</h1>
<small>VERSION 1.6 · Memory manager</small>
</header>

<details id="account" open>
<summary id="authstatus">Checking...</summary>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password (6+ characters)">
<button onclick="signUp()">Sign up</button>
<button onclick="signIn()">Sign in</button>
<button onclick="signOut()">Sign out</button>
<button onclick="forgotPassword()">Forgot password</button>
<button id="setpw" style="display:none" onclick="setNewPassword()">Set new password</button>
</details>

<div id="alerts" onclick="showTasks()"></div>

<section id="conversationbar" aria-label="Conversation history">
<select id="conversationSelect" aria-label="Choose a conversation" disabled>
<option value="">Sign in to load conversations</option>
</select>
<button id="newchatbtn" type="button" onclick="newChat()">+ New chat</button>
</section>

<div id="chat"></div>

<div id="tools">
<button onclick="showMemories()">Show memories</button>
<button onclick="showTasks()">Show tasks</button>
<button onclick="newChat()">New chat</button>
<button id="themebtn" onclick="cycleTheme()">Theme</button>
<button id="speakbtn" onclick="toggleSpeak()">🔇 Voice off</button>
</div>

<div id="bar">
<button id="micbtn" onclick="startVoice()">🎤</button>
<input id="command" placeholder="Message Jeeves...">
<button id="sendbtn" onclick="send()">Send</button>
</div>

<script src="app.js?v=1.5.1"></script>
<script src="auth.js"></script>
<script src="lists.js?v=1.6.0"></script>
<script src="voice.js"></script>
<script src="jeeves.js"></script>
<script src="speak.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
